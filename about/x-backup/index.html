<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x backup | aravindirl</title>
    <meta name="description" content="Backup archive of X articles by Aravind Ramachandran">
    <meta property="og:title" content="x backup | Aravind Ramachandran">
    <meta property="og:description" content="Backup for my X articles.">
    <meta property="og:type" content="website">
    <meta name="author" content="Aravind Ramachandran">
    <meta name="robots" content="index, follow">
    <meta property="og:image" content="https://www.aravindirl.com/og.svg">
    <meta property="og:url" content="https://www.aravindirl.com/about/x-backup/">
    <link rel="canonical" href="https://www.aravindirl.com/about/x-backup/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://www.aravindirl.com/og.svg">
    <script>
    (function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
    </script>
    <link rel="stylesheet" href="../../css/theme.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: ui-monospace, Menlo, Monaco, 'Cascadia Code', 'Source Code Pro', Consolas, monospace;
            font-size: 13px;
            line-height: 1.65;
            padding: 40px 40px 72px;
            margin: 0;
        }
        
        a { text-underline-offset: 2px; text-decoration-thickness: from-font; }
        .container {
            max-width: 860px;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0 0 8px 0;
        }
        .intro {
            font-size: 0.85rem;
            color: var(--secondary);
            margin: 0 0 20px 0;
        }
        ol {
            margin: 0 0 40px 0;
            padding-left: 28px;
        }
        ol li {
            margin-bottom: 8px;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        ol li a {
            color:var(--link);
            text-decoration: underline;
        }
        ol li a:visited {
            color:var(--link-v);
        }
        .back-link {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color:var(--text);
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .back-link:visited {
            color:var(--text);
        }
        @media (max-width: 640px) {
            body { padding: 24px 16px 56px; }
        }
    </style>
</head>
<body>
    <button type="button" class="theme-toggle" data-theme-toggle>dark</button>
    <script>
    document.addEventListener('keydown',function(e){
        if(e.key==='Backspace'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){ e.preventDefault(); history.back(); }
    });
    </script>
    <div class="container">
        <h1>x backup</h1>
        <p class="intro">backup for my x articles</p>
        <ol reversed>
            <!-- add backed-up X articles here -->
        </ol>
        <a href="../about.html" class="back-link">← back to about</a>
    </div>
    <script src="../../js/theme.js"></script>
</body>
</html>
